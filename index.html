<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pabbly subscription batch</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { background: #101418; color: #e8edf2; margin: 0; padding: 32px 16px; }
      main { max-width: 760px; margin: 0 auto; }
      h1 { margin: 0 0 8px; } p { color: #aebbc7; }
      label { display: block; font-weight: 650; margin: 20px 0 8px; }
      input, textarea { box-sizing: border-box; width: 100%; color: inherit; background: #192129; border: 1px solid #3a4753; border-radius: 8px; padding: 11px; font: inherit; }
      textarea { min-height: 170px; resize: vertical; }
      .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
      button { cursor: pointer; border: 0; border-radius: 8px; padding: 11px 15px; font: inherit; font-weight: 700; background: #3b82f6; color: white; }
      button.secondary { background: #35424e; } button:disabled { opacity: .5; cursor: not-allowed; }
      .confirm { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: #c8d3dc; }
      .confirm input { width: auto; }
      #summary { margin: 20px 0 10px; font-weight: 650; }
      .workspace { display: block; }
      #emails, #log { border: 1px solid #303d48; border-radius: 8px; background: #151c22; padding: 12px; }
      #emails { max-height: 220px; overflow: auto; } #emails li { margin: 5px 0; }
      .terminal { position: fixed; inset: 0 0 0 auto; width: min(38vw, 460px); height: 100vh; border-left: 1px solid #354654; overflow: hidden; background: #0b0f13; box-shadow: -14px 0 35px #0004; }
      .terminal-bar { display: flex; align-items: center; gap: 7px; padding: 11px 13px; background: #1b252e; border-bottom: 1px solid #354654; font: 600 .8rem ui-monospace, monospace; color: #bdc9d3; }
      .terminal-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
      .terminal-dot:nth-child(2) { background: #febc2e; } .terminal-dot:nth-child(3) { background: #28c840; }
      #log { white-space: pre-wrap; min-height: 0; height: calc(100vh - 44px); overflow: auto; border: 0; border-radius: 0; background: #0b0f13; font: .86rem ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.55; }
      .success { color: #64d89b; } .error { color: #ff8585; }
      dialog { color: #e8edf2; background: #151c22; border: 1px solid #435566; border-radius: 12px; width: min(460px, calc(100vw - 32px)); padding: 22px; box-shadow: 0 20px 70px #0009; }
      dialog::backdrop { background: #000a; } dialog h2 { margin: 0; } .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
      @media (min-width: 801px) { body { padding-right: calc(min(38vw, 460px) + 32px); } }
      @media (max-width: 800px) { .terminal { position: static; width: auto; height: auto; margin-top: 24px; border: 1px solid #354654; border-radius: 10px; } #log { min-height: 220px; height: auto; max-height: 360px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Subscription batch</h1>
      <p>Enter one email per line or separate them with commas. Requests are sent one at a time, five seconds apart.</p>

      <div class="workspace">
        <section>
          <label for="emailInput">Email addresses</label>
          <textarea id="emailInput" placeholder="first@example.com&#10;second@example.com"></textarea>

          <div class="actions">
            <button class="secondary" id="previewButton" type="button">Preview emails</button>
            <button class="secondary" id="settingsButton" type="button">Settings</button>
            <button class="secondary" id="stopButton" type="button" disabled>Stop sending</button>
            <label class="confirm"><input id="confirm" type="checkbox" /> I confirm I am authorized to create these subscriptions.</label>
            <button id="sendButton" type="button" disabled>Send requests</button>
          </div>

          <div id="summary">No emails loaded.</div>
          <ol id="emails"></ol>
        </section>

        <aside class="terminal">
          <div class="terminal-bar"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span>request-log</div>
          <div id="log" aria-live="polite">$ Waiting for input.</div>
        </aside>
      </div>

      <dialog id="settingsModal">
        <form id="settingsForm">
          <h2>Payment settings</h2>
          <label for="gatewayId">Gateway ID</label>
          <input id="gatewayId" required />
          <label for="gatewayType">Gateway type</label>
          <input id="gatewayType" required />
          <label for="planId">Plan ID</label>
          <input id="planId" required />
          <div class="modal-actions">
            <button class="secondary" id="cancelSettings" type="button">Cancel</button>
            <button type="submit">Save settings</button>
          </div>
        </form>
      </dialog>
    </main>

    <script>
      const emailInput = document.querySelector('#emailInput');
      const previewButton = document.querySelector('#previewButton');
      const settingsButton = document.querySelector('#settingsButton');
      const stopButton = document.querySelector('#stopButton');
      const sendButton = document.querySelector('#sendButton');
      const confirm = document.querySelector('#confirm');
      const summary = document.querySelector('#summary');
      const emailsElement = document.querySelector('#emails');
      const log = document.querySelector('#log');
      const settingsModal = document.querySelector('#settingsModal');
      const settingsForm = document.querySelector('#settingsForm');
      const cancelSettings = document.querySelector('#cancelSettings');
      const settingInputs = {
        gateway_id: document.querySelector('#gatewayId'),
        gateway_type: document.querySelector('#gatewayType'),
        plan_id: document.querySelector('#planId'),
      };
      const defaultSettings = {
        gateway_id: '6a8dec8781882a66eed4a171',
        gateway_type: '6a8dec8781882a66eed4a171',
        plan_id: '6a8ded024f5ad067036b1382',
      };
      let activeRequest = null;

      function getSettings() {
        try { return { ...defaultSettings, ...JSON.parse(localStorage.getItem('paymentSettings')) }; }
        catch { return defaultSettings; }
      }

      function populateSettings() {
        const settings = getSettings();
        for (const [key, input] of Object.entries(settingInputs)) input.value = settings[key];
      }

      function emails() {
        return [...new Set(emailInput.value.split(/[\n,]+/).map((email) => email.trim()).filter(Boolean))];
      }

      function nameFromEmail(email) {
        const localPart = email.split('@')[0].split('+')[0].replace(/\d+$/, '').replace(/[._-]+/g, ' ').trim();
        const match = localPart.match(/^(md|mr|mrs|ms|dr)([a-z].*)$/i);
        const words = match ? [match[1], match[2]] : localPart.split(/\s+/);
        const titleCase = (word) => word ? word[0].toUpperCase() + word.slice(1).toLowerCase() : '';
        return { first_name: titleCase(words[0]), last_name: words.slice(1).map(titleCase).join(' ') };
      }

      function renderPreview() {
        const list = emails();
        const invalid = list.filter((email) => !/^\S+@\S+\.\S+$/.test(email));
        summary.textContent = `${list.length} unique email${list.length === 1 ? '' : 's'} loaded${invalid.length ? ` (${invalid.length} appear invalid)` : ''}.`;
        emailsElement.replaceChildren(...list.map((email) => {
          const item = document.createElement('li');
          const { first_name, last_name } = nameFromEmail(email);
          item.textContent = `${email} — ${first_name} ${last_name}`.trim();
          return item;
        }));
        sendButton.disabled = !list.length || invalid.length > 0 || !confirm.checked;
        return list;
      }

      function appendLog(message, type = '') {
        const line = document.createElement('div');
        line.className = type;
        line.textContent = message;
        log.append(line);
        log.scrollTop = log.scrollHeight;
      }

      async function readLogStream(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === 'result') {
              appendLog(
                event.ok ? `${event.email}: HTTP ${event.status}` : `${event.email}: ${event.error}`,
                event.ok ? 'success' : 'error',
              );
            } else if (event.type === 'wait') {
              appendLog(event.message);
            } else if (event.type === 'complete') {
              appendLog('Finished.');
            }
          }
          if (done) break;
        }
      }

      previewButton.addEventListener('click', renderPreview);
      emailInput.addEventListener('input', renderPreview);
      confirm.addEventListener('change', renderPreview);
      settingsButton.addEventListener('click', () => { populateSettings(); settingsModal.showModal(); });
      cancelSettings.addEventListener('click', () => settingsModal.close());
      settingsForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const settings = Object.fromEntries(Object.entries(settingInputs).map(([key, input]) => [key, input.value.trim()]));
        localStorage.setItem('paymentSettings', JSON.stringify(settings));
        settingsModal.close();
        appendLog('Payment settings saved locally.');
      });
      stopButton.addEventListener('click', () => {
        if (!activeRequest) return;
        appendLog('Stopping the current batch...');
        activeRequest.abort();
        stopButton.disabled = true;
      });

      sendButton.addEventListener('click', async () => {
        const list = renderPreview();
        if (!confirm.checked) return alert('Confirm authorization before sending requests.');

        sendButton.disabled = true;
        previewButton.disabled = true;
        stopButton.disabled = false;
        activeRequest = new AbortController();
        log.replaceChildren();
        appendLog(`Sending ${list.length} request(s) sequentially...`);
        try {
          const response = await fetch('/api/subscriptions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emails: list, settings: getSettings() }),
            signal: activeRequest.signal,
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || `HTTP ${response.status}`);
          }
          await readLogStream(response);
        } catch (error) {
          appendLog(error.name === 'AbortError' ? 'Stopped.' : error.message, error.name === 'AbortError' ? '' : 'error');
        }
        activeRequest = null;
        stopButton.disabled = true;
        previewButton.disabled = false;
        renderPreview();
      });
    </script>
  </body>
</html>
